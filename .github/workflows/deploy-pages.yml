name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/survival-card-game-Ax7rE
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/survival-card-game-Ax7rE

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,.git,README.md'
          commit_message: 'Deploy Diabrogue game to GitHub Pages'
